<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Responsive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            text-align: center;
        }
        header {
            background: #333;
            color: white;
            padding: 15px;
        }
        .menu {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
        }
        .menu ul {
            list-style: none;
            display: flex;
        }
        .menu ul li {
            margin: 0 10px;
        }
        .menu ul li a {
            color: white;
            text-decoration: none;
        }
        .menu-toggle {
            display: none;
            font-size: 24px;
            cursor: pointer;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }
        .box {
            background: lightblue;
            margin: 10px;
            padding: 20px;
            width: 300px;
            border-radius: 10px;
        }
        @media (max-width: 768px) {
            .menu ul {
                display: none;
                flex-direction: column;
                background: #444;
                position: absolute;
                width: 100%;
                left: 0;
                top: 50px;
                text-align: center;
            }
            .menu ul.active {
                display: flex;
            }
            .menu-toggle {
                display: block;
            }
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="menu">
            <h2>Mi Página</h2>
            <span class="menu-toggle">&#9776;</span>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Servicios</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <section class="container">
        <div class="box">Caja 1</div>
        <div class="box">Caja 2</div>
        <div class="box">Caja 3</div>
    </section>
    <script>
        document.querySelector(".menu-toggle").addEventListener("click", function() {
            document.querySelector(".menu ul").classList.toggle("active");
        });
    </script>
</body>
</html>
